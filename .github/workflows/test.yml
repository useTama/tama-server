name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      # Includes the retrieval evals, which need no model and no key. The
      # answer evals skip themselves here: they are gated on TAMA_EVAL_MODEL,
      # and a rate limit failing a push is a worse signal than not running.
      - run: bun test
      # The bridge has its own package.json, so the run above does not reach it
      # and its five test files had never run here. They cover the things that
      # broke in production: which identifiers a message presents, the media
      # retry, and our own mention.
      - run: bun test clients/whatsapp-webjs
      # And the desktop bundle's, for the same reason. Its relay is the piece
      # that turns a wrong URL or a revoked token into a sentence someone can
      # act on, and every one of its tests is about that text.
      - run: bun test clients/claude-desktop
      # And the plugin's. Its transcript filter decides what a session summary
      # is made of, which is the one thing here whose output nobody reviews
      # before it lands in a git repo.
      - run: bun test clients/claude-code
      # Validated against the real mcpb schema rather than only parsed as JSON,
      # so a manifest that installs nowhere fails here instead of at somebody's
      # double-click. The bundle only: `mcpb validate` rejects a Claude Code
      # plugin.json as an unsupported manifest version, and the plugin's own
      # shape is asserted in test/clients.test.ts.
      - run: bunx --bun @anthropic-ai/mcpb@latest validate clients/claude-desktop/manifest.json

      # The judge-free half of the answer eval: whether the model cited a path
      # it was never shown. A fabricated filename is a fabricated source, and a
      # model willing to invent one will invent the fact underneath it, so this
      # is the sharpest cheap signal there is - and it used to sit behind a paid
      # key alongside the faithfulness checks, which is why it never ran (#61).
      #
      # Off until someone sets the repository variable TAMA_EVAL_LOCAL_MODEL.
      # Installing a model server puts a third-party download in the path of
      # every push, so their outage becomes our red build - the same bad signal
      # that a paid key was rejected for. Setting the variable is the entire
      # switch; nothing here needs editing to turn it on.
      - name: a local model, if one is configured
        if: vars.TAMA_EVAL_LOCAL_MODEL != ''
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          # Bounded: a hang here would burn the job's whole timeout on a
          # service that is never coming up.
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          ollama pull "${{ vars.TAMA_EVAL_LOCAL_MODEL }}"

      - name: citations and refusals, against that model
        if: vars.TAMA_EVAL_LOCAL_MODEL != ''
        env:
          TAMA_EVAL_LOCAL_MODEL: ${{ vars.TAMA_EVAL_LOCAL_MODEL }}
        run: bun test test/eval/answer.eval.test.ts
