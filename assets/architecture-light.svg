<svg xmlns="http://www.w3.org/2000/svg" width="900" height="272" viewBox="0 0 900 272" role="img" aria-label="Clients post to tama-server, which runs two paths. The capture path is ffmpeg then whisper.cpp then an atomic journalled write, and it writes to your vault. The ask path is grep retrieval then an LLM adapter, and it reads from your vault. No language model is in the capture path."><defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1f2328" flood-opacity="0.07"/></filter></defs><text x="222" y="18" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="1.2" fill="#59636e">TAMA-SERVER</text><rect x="218" y="28" width="404" height="222" rx="16" fill="none" stroke="#d1d9e0" stroke-width="1" stroke-dasharray="6 5"/><rect x="20" y="98" width="150" height="76" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1" filter="url(#sh)"/><text x="38" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#0969da">clients</text><text x="38" y="147" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#59636e">curl · Shortcut</text><text x="38" y="161" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#59636e">· the board</text><path d="M178 136 H206" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M205 131.5 L211 136 L205 140.5" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="182" y="128" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8c959f">token</text><rect x="244" y="56" width="352" height="70" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1" filter="url(#sh)"/><text x="264" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1a7f37">capture &#8594; POST /capture</text><text x="264" y="105" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#59636e">ffmpeg 16k &#8594; whisper.cpp &#8594; atomic write</text><rect x="244" y="152" width="352" height="70" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1" filter="url(#sh)"/><text x="264" y="180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#8250df">ask &#8594; POST /ask</text><text x="264" y="201" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#59636e">grep retrieval &#8594; LLM adapter &#8594; answer</text><path d="M602 91 H694" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M693 86.5 L699 91 L693 95.5" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="626" y="83" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8c959f">writes</text><path d="M694 187 H602" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M603 182.5 L597 187 L603 191.5" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="629" y="179" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#8c959f">reads</text><rect x="700" y="56" width="180" height="166" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1" filter="url(#sh)"/><text x="720" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#9a6700">your vault</text><text x="720" y="143" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#59636e">plain markdown,</text><text x="720" y="157" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#59636e">git-tracked, yours</text><text x="244" y="243" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#59636e">No language model in the capture path, so capture needs no account and no key.</text></svg>
