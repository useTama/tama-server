# Default: API transcription only. One small image, ~1 minute to build.
#
#   docker compose up -d --build
#
# Local whisper is opt-in, because compiling whisper.cpp and holding a model
# resident is load you should choose, not inherit:
#
#   docker compose --profile local-stt up -d --build
#
# and point stt at http://whisper:8081 in tama.config.json.
services:
  tama:
    build: .
    restart: unless-stopped
    ports:
      # Loopback only. Put a TLS reverse proxy in front before exposing it.
      - "127.0.0.1:8080:8080"
    environment:
      TAMA_CONFIG: /etc/tama/tama.config.json
      # Whichever one the config's apiKeyEnv names; the rest stay empty.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./tama.config.json:/etc/tama/tama.config.json:ro
      - tama-vault:/vault
      - tama-data:/data

  # Never built or started without --profile local-stt. There is deliberately
  # no depends_on: Tama starts either way and reports stt health at /health.
  whisper:
    profiles: ["local-stt"]
    build:
      context: ./docker
      dockerfile: whisper.Dockerfile
      args:
        # ggml-base.bin on a 1 GB box; ggml-small.bin from ~2 GB up.
        MODEL: ggml-small.bin
    restart: unless-stopped
    expose:
      - "8081"

volumes:
  tama-vault:
  tama-data:
