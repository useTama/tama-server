# First run:
#
#   mkdir -p config
#   docker compose run --rm setup        # the wizard; paste your API key here
#   docker compose up -d --build
#
# Later changes - a WhatsApp number, a revoked device - are one section, not
# the whole wizard:
#
#   docker compose run --rm settings
#
# The vault is a named volume by default. To keep it as a folder you can open,
# edit and push to a private git remote:
#
#   TAMA_VAULT_DIR=/home/ubuntu/vault, in .env, then move the data across once.
#   See docs/deploy-docker.md.
#
# A container has no timezone, so "local" means UTC and notes captured after
# midnight are filed under the previous day. Set your own, in .env:
#
#   TZ=Asia/Kolkata
#
# It decides note filenames, the captured: stamp, and when the daily digest
# fires. The startup banner prints the zone and the local time it believes.
#
# Do not pre-copy tama.config.docker.json into config/ before the wizard: that
# template's placeholder adminToken is rejected on load by design. The template
# is for configuring by hand instead of running the wizard.
#
# Default transcription is an API call, so this builds one small image in about
# a minute and the server runs no inference. Local whisper is opt-in:
#
#   docker compose --profile local-stt up -d --build
#
# Unofficial WhatsApp, against WhatsApp's terms, ban risk on the account:
#
#   docker compose --profile whatsapp-webjs up -d --build
#
# The whole config directory is mounted, not just the file, because the wizard
# writes each secret to its own 0600 file beside the config.
services:
  tama:
    build: .
    restart: unless-stopped
    ports:
      # Loopback only. Put a TLS reverse proxy in front before exposing it.
      - "127.0.0.1:8080:8080"
    environment:
      TAMA_CONFIG: /etc/tama/tama.config.json
      # Notes are dated in this zone, and the digest fires by it. Unset means
      # UTC, which files a note taken at 1am under yesterday.
      TZ: ${TZ:-UTC}
    volumes:
      - ./config:/etc/tama:ro
      # Defaults to a named volume, which needs no setup and survives a
      # rebuild. Set TAMA_VAULT_DIR to a path and the vault becomes a folder
      # you can ls, edit and git push - which is what most people want once
      # there is anything in it, since "a folder you own" is the whole pitch.
      - ${TAMA_VAULT_DIR:-tama-vault}:/vault
      - tama-data:/data

  # The setup wizard, run interactively and then thrown away. Same image, same
  # volumes, one difference: it may write to the config directory.
  setup:
    profiles: ["setup"]
    build: .
    command: ["bun", "run", "src/tama.ts", "setup", "--config", "/etc/tama/tama.config.json"]
    environment:
      # What the wizard should suggest instead of a home directory that does
      # not outlive the container.
      TAMA_VAULT: /vault
      TAMA_DATA_DIR: /data
      TZ: ${TZ:-UTC}
    volumes:
      - ./config:/etc/tama
      - ${TAMA_VAULT_DIR:-tama-vault}:/vault
      - tama-data:/data

  # Same image and volumes as setup, one section at a time instead of the whole
  # first-run flow. This is where you add a phone number to the WhatsApp bridge
  # or revoke a device, rather than editing .env by hand.
  #
  #   docker compose run --rm settings
#
# The vault is a named volume by default. To keep it as a folder you can open,
# edit and push to a private git remote:
#
#   TAMA_VAULT_DIR=/home/ubuntu/vault, in .env, then move the data across once.
#   See docs/deploy-docker.md.
  settings:
    profiles: ["settings"]
    build: .
    command: ["bun", "run", "src/tama.ts", "settings", "--config", "/etc/tama/tama.config.json"]
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./config:/etc/tama
      - ${TAMA_VAULT_DIR:-tama-vault}:/vault
      - tama-data:/data

  # Never built or started without --profile local-stt. There is deliberately
  # no depends_on: Tama starts either way and reports stt health at /health.
  whisper:
    profiles: ["local-stt"]
    build:
      context: ./docker
      dockerfile: whisper.Dockerfile
      args:
        # ggml-base.bin on a 1 GB box; ggml-small.bin from ~2 GB up.
        MODEL: ggml-small.bin
    restart: unless-stopped
    expose:
      - "8081"

  # Unofficial WhatsApp, and never started without --profile whatsapp-webjs.
  # whatsapp-web.js logs in as your own account through WhatsApp Web, which is
  # why it needs no Meta app, no dedicated number and no public HTTPS: the
  # connection is outbound. It is also against WhatsApp's terms and the account
  # can be banned. The supported path is the `whatsapp` block in the config.
  #
  # It is a client, not part of the server. It holds a device token and posts
  # to /capture and /ask like any other client, so tama needs no config for it.
  whatsapp-webjs:
    profiles: ["whatsapp-webjs"]
    build: ./clients/whatsapp-webjs
    restart: unless-stopped
    depends_on: [tama]
    environment:
      TAMA_URL: http://tama:8080
      # The device token and allowed numbers come from
      # config/whatsapp-bridge.json, written by `tama-server setup` and editable
      # with `tama-server settings`. These override it when set, for a one-off
      # or a pre-wizard deployment.
      TAMA_TOKEN: "${TAMA_TOKEN:-}"
      WA_ALLOWED: "${WA_ALLOWED:-}"
      # A runaway guard, not a politeness setting. Raise the budget for a group
      # that talks; it exists to stop a loop with another bot, not to ration a
      # conversation.
      WA_REPLY_BUDGET: "${WA_REPLY_BUDGET:-30}"
      WA_BUDGET_MINUTES: "${WA_BUDGET_MINUTES:-10}"
      WA_CONVERSATION_MINUTES: "${WA_CONVERSATION_MINUTES:-5}"
      # Only its log timestamps, but a bridge log an hour out from the server's
      # is unreadable next to it when something has gone wrong.
      TZ: ${TZ:-UTC}
    volumes:
      # Read-only, and the same directory the server and wizard share. The
      # bridge watches its settings file and reloads changes while running.
      - ./config:/etc/tama:ro
      - whatsapp-session:/session

volumes:
  tama-vault:
  tama-data:
  whatsapp-session:
